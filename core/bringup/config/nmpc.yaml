# Quadrotor NMPC horizon/objective/command-bound configuration for codegen/runtime.
# ENU world, FLU body, Hamilton wxyz, collective thrust along +Z_B.
# N = horizon_s / traj_res_s. No wing-force state or aerodynamic parameter.
nmpc:
  horizon_s: 1.0 # prediction horizon [s]
  traj_res_s: 0.1 # prediction interval [s]
  ctrl_frq: 50.0 # actual command integration frequency [Hz]
  initial_specific_thrust: 9.81 # initial command [N/kg], NOT a cost reference
  objective:
    position: [15.0, 15.0, 10.0]
    velocity: [1.0, 1.0, 1.0]
    body_y: [52.5, 52.5, 126.0]
    # Cost on dc/dt only; c = [specific_thrust, body_rate_x/y/z].
    # These numerical weights are retained, not claimed to be newly tuned.
    command_derivative: [0.03, 0.03, 0.03, 0.03]
  command_bounds:
    # Absolute command/state bounds, NOT bounds on command derivatives.
    lower: [0.0, -1.5, -2.5, -1.5] # [N/kg, rad/s, rad/s, rad/s]
    upper: [22.0, 1.5, 2.5, 1.5]
