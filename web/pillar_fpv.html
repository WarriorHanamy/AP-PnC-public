const NPTS = 52629;
const NSAMP = 1582;

function b64f32(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}
const canvas = document.getElementById("view");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
if (!gl) {
  document.getElementById("wrap").style.display = "none";
  const err = document.getElementById("err");
  err.style.display = "block";
  err.textContent = "这个浏览器没有 WebGL，页面画不出来。";
  throw new Error("no webgl");
}
const cloud = b64f32(CLOUD_B64);
const traj = b64f32(TRAJ_B64);
const vs = `
attribute vec3 aPos;
uniform mat4 uMVP;
varying float vZ;
varying float vW;
void main() {
  vec4 p = uMVP * vec4(aPos, 1.0);
  gl_Position = p;
  vZ = aPos.z;
  vW = p.w;
  float pillar = step(0.25, aPos.z);
  gl_PointSize = mix(clamp(26.0 / p.w, 1.0, 2.2), clamp(150.0 / p.w, 2.0, 8.0), pillar);
}`;
const fs = `
precision mediump float;
varying float vZ;
varying float vW;
void main() {
  vec2 c = gl_PointCoord - vec2(0.5);
  if (dot(c, c) > 0.25) discard;
  vec3 floorC = vec3(0.45, 0.46, 0.45);
  vec3 shaft = vec3(0.80, 0.75, 0.64);
  vec3 crown = vec3(0.96, 0.91, 0.78);
  float h = clamp((vZ - 0.25) / 3.2, 0.0, 1.0);
  vec3 col = vZ <= 0.25 ? floorC : mix(shaft, crown, h);
  float fog = clamp((vW - 8.0) / 34.0, 0.0, 1.0);
  col = mix(col, vec3(0.73, 0.80, 0.84), fog);
  gl_FragColor = vec4(col, 1.0);
}`;
function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, cloud, gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
const uMVP = gl.getUniformLocation(prog, "uMVP");
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.62, 0.72, 0.80, 1);

function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }

function norm(a) {
  const n = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0]/n, a[1]/n, a[2]/n];
}
function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
  return o;
}
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  const nf = 1 / (near - far);
  return new Float32Array([
    f/aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far+near)*nf, -1,
    0, 0, 2*far*near*nf, 0

function viewOf(eye, forward) {
  const pitch = -3 * Math.PI / 180;
  const up0 = [0, 0, 1];
  const right = norm(cross(forward, up0));
  const c = Math.cos(pitch), s = Math.sin(pitch);
  const kxv = cross(right, forward);
  const kdv = dot(right, forward);
  const f = norm([
    forward[0]*c + kxv[0]*s + right[0]*kdv*(1-c),
    forward[1]*c + kxv[1]*s + right[1]*kdv*(1-c),
    forward[2]*c + kxv[2]*s + right[2]*kdv*(1-c)

  const sx = norm(cross(f, up0));
  const u = cross(sx, f);
  return new Float32Array([
    sx[0], u[0], -f[0], 0,
    sx[1], u[1], -f[1], 0,
    sx[2], u[2], -f[2], 0,

const STRIDE = 9;
const duration = traj[(NSAMP - 1) * STRIDE];
let playing = true;
let simTime = 0;
let last = performance.now();
const hud = document.getElementById("hud");
const speedEl = document.getElementById("speed");
const scrub = document.getElementById("scrub");
const playBtn = document.getElementById("play");
function pose(time) {
  const clamped = Math.max(0, Math.min(duration, time));
  let i = Math.min(NSAMP - 2, Math.max(0, Math.floor(clamped / duration * (NSAMP - 1))));
  const t0 = traj[i * STRIDE], t1 = traj[(i + 1) * STRIDE];
  const u = t1 > t0 ? Math.max(0, Math.min(1, (clamped - t0) / (t1 - t0))) : 0;
  const sample = (k) => traj[i * STRIDE + k] * (1 - u) + traj[(i + 1) * STRIDE + k] * u;
  return { eye: [sample(1), sample(2), sample(3)], look: [sample(4), sample(5), sample(6)], speed: sample(7), vy: sample(8) };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();
function draw(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) {
    simTime += dt;
    if (simTime > duration) simTime = 0;
    scrub.value = String(Math.round(simTime / duration * 1000));
  }
  const p = pose(simTime);
  const aspect = canvas.width / canvas.height;
  const hfov = 78 * Math.PI / 180;
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / aspect);
  gl.uniformMatrix4fv(uMVP, false, mul(perspective(vfov, aspect, 0.25, 70), viewOf(p.eye, p.look)));
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, NPTS);
  hud.textContent = p.vy >= 0 ? "去程 → 北端" : "返程 → 南端";
  speedEl.textContent = p.speed.toFixed(1) + " m/s";
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "暂停" : "播放";
  last = performance.now();
});
scrub.addEventListener("input", () => {
  simTime = Number(scrub.value) / 1000 * duration;
  playing = false;
  playBtn.textContent = "播放";
});
</script>
